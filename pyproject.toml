[project]
name = "sim-parse"
version = "0.1.0"
description = "Universal CAE simulation result parser — per-case static extraction with tiered output"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "sim-parse contributors" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fields = ["vtk>=9.3", "h5py>=3.0"]
discovery = ["httpx>=0.25"]
all = ["sim-parse[fields,discovery]"]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
simparse = "sim_parse.cli.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sim_parse" = [
    "core/canonical/*.yaml",
    "core/canonical/qoi_rules/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
